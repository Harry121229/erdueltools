[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/shared/macros",
    "crates/shared/stl",
    "crates/eldenring",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Harry121229/erdueltools"

[workspace.dependencies]
fromsoftware-shared = { path = "crates/shared", version = "0.14.0", package = "fromsoftware-shared" }
fromsoftware-shared-macros = { path = "crates/shared/macros", version = "0.14.0", package = "fromsoftware-shared-macros" }
fromsoftware-shared-stl = { path = "crates/shared/stl", version = "0.14.0", package = "fromsoftware-shared-stl" }
eldenring = { path = "crates/eldenring", version = "0.14.0", package = "eldenring" }
bitflags = "2.11.0"
thiserror = "1"
glam = ">= 0.30"
pelite = "0.10"
vtable-rs = "0.1.4"
bitfield = "0.19.2"
encoding_rs = "0.8.35"
num_enum = "0.7"

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
]

[workspace.dependencies.hudhook]
git = "https://github.com/veeenu/hudhook"
features = ["imgui-tables-api"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

[package]
name = "erdueltools"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish = false
description = "Elden Ring duel build toolkit — save/load armor, weapons, talismans, stats, and spells"

[lib]
crate-type = ["cdylib"]
name = "erdueltools"

[dependencies]
fromsoftware-shared.workspace = true
eldenring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
retour = { version = "0.3", default-features = false }
hudhook.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
